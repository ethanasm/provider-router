name: Release

# One tag, both registries. The two packages share a name and a version, so
# splitting them across `py-v*` / `ts-v*` tags bought independent versioning
# nobody wanted and cost a release that silently published nothing — `v0.1.0`
# matched neither pattern, so the workflow never ran.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publishing is idempotent: a version already present on a registry is skipped
# rather than failing, so a re-run after a half-finished release completes it
# instead of going red.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match both manifests)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing — no long-lived token in secrets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Never publish something the tests haven't seen.
      - run: uv venv --python 3.12
      - run: uv pip install -e './python[dev]'
      - run: uv run pytest python/tests -q

      - name: Resolve and verify the version
        id: version
        run: |
          want="${VERSION:-${GITHUB_REF_NAME#v}}"
          have=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version'])")
          [ "$want" = "$have" ] || { echo "::error::tag $want != pyproject version $have"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on PyPI
        id: published
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/provider-router/${{ steps.version.outputs.version }}/json")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.published.outputs.exists == 'false'
        run: uv build python --out-dir dist
      - if: steps.published.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: typescript
    permissions:
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

      - name: Resolve and verify the version
        id: version
        run: |
          want="${VERSION:-${GITHUB_REF_NAME#v}}"
          have=$(node -p "require('./package.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $want != package.json version $have"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: published
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/provider-router/${{ steps.version.outputs.version }}")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
